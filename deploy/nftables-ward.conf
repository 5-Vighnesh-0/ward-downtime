#!/usr/sbin/nft -f
# Ward server host firewall (SEC-26, design.md §11.1). Steps and checks: docs/runbooks/RB-NET.md.
# Replace the example values below (documentation ranges, RFC 5737) with the ward's own before loading.
define LAN_IF = "eth0"                 # the ward server's LAN interface
define WARD_VLAN = 192.0.2.0/24        # tablets
define JUMP_HOST = 198.51.100.10       # IT jump host, the only SSH source
define NTP_SERVER = 198.51.100.20      # hospital NTP (SEC-28)
define BACKUP_TARGET = 198.51.100.30   # off-box backup copies (rsync over SSH)

# Re-running this file replaces the table instead of adding a second copy.
table inet wdb
delete table inet wdb

table inet wdb {
	# Priority filter - 1: runs before Docker's own rules. A drop here is final; an accept still lets Docker decide.
	chain input {
		type filter hook input priority filter - 1; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto ipv6-icmp accept
		iifname $LAN_IF ip saddr $JUMP_HOST tcp dport 22 accept
		iifname $LAN_IF ip saddr $WARD_VLAN icmp type echo-request accept
		iifname "docker0" accept
		iifname "br-*" accept
	}

	# Published ports (443, 80) bypass the input chain: Docker forwards them to the containers after DNAT.
	chain forward {
		type filter hook forward priority filter - 1; policy accept;
		iifname $LAN_IF oifname "docker0" ip saddr != $WARD_VLAN drop
		iifname $LAN_IF oifname "br-*" ip saddr != $WARD_VLAN drop
		iifname $LAN_IF oifname "docker0" meta nfproto ipv6 drop
		iifname $LAN_IF oifname "br-*" meta nfproto ipv6 drop
		# Containers never start connections out of the ward server.
		iifname "docker0" oifname $LAN_IF ct state new drop
		iifname "br-*" oifname $LAN_IF ct state new drop
	}

	# Outbound from the host: NTP and the backup target only. No internet, no DNS.
	chain output {
		type filter hook output priority filter - 1; policy drop;
		oif "lo" accept
		ct state established,related accept
		meta l4proto ipv6-icmp accept
		oifname "docker0" accept
		oifname "br-*" accept
		oifname $LAN_IF ip daddr $NTP_SERVER udp dport 123 accept
		oifname $LAN_IF ip daddr $BACKUP_TARGET tcp dport 22 accept
	}
}
