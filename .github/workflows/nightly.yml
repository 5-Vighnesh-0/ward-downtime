# Nightly property tests with a random seed and 20,000 runs (design.md §9.8, §12.1; PB-01 to PB-05), and SIM-01/02 at
# 10,000 operations with a random seed (§12.2). CI runs fixed seeds; this explores new ones. A failure keeps its log,
# which names the seed to replay:
#   WDB_PROP_SEED=<seed> WDB_PROP_RUNS=20000 pnpm --filter @wdb/shared exec vitest run test/prop --testTimeout=1200000
#   WDB_SIM_SEED=<seed> WDB_SIM_OPS=10000 pnpm --filter @wdb/web test:sim   (needs: docker compose up -d db-test)
name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WDB_PROP_RUNS: '20000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One seed for every test file, printed at the top of the log.
      - run: |
          export WDB_PROP_SEED=$(( (RANDOM << 15) | RANDOM ))
          { echo "seed $WDB_PROP_SEED"; pnpm --filter @wdb/shared exec vitest run test/prop --testTimeout=1200000; } 2>&1 | tee "$RUNNER_TEMP/properties.log"
        shell: bash -o pipefail {0}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failing-seed
          path: ${{ runner.temp }}/properties.log

  simulations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Same throwaway test database as compose.yaml's db-test.
      db-test:
        image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_USER: wdb_owner
          POSTGRES_DB: wdb_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wdb_owner"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      WDB_SIM_OPS: '10000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          export WDB_SIM_SEED=$(( (RANDOM << 15) | RANDOM ))
          { echo "seed $WDB_SIM_SEED"; pnpm --filter @wdb/web test:sim; } 2>&1 | tee "$RUNNER_TEMP/simulations.log"
        shell: bash -o pipefail {0}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failing-sim-seed
          path: ${{ runner.temp }}/simulations.log
